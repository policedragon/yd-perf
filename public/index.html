<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>永定绩效 · 打击办案积分管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef1f6;color:#1f2329;padding-bottom:64px;font-size:14px}
.top{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:90;box-shadow:0 2px 10px rgba(30,58,138,.25)}
.top h1{font-size:16px;font-weight:600}
.top .sub{font-size:11px;opacity:.85;margin-top:3px}
.top .who{position:absolute;right:14px;top:10px;font-size:12px;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:14px;cursor:pointer;color:#fff}
.top .demo{position:absolute;right:14px;top:42px;font-size:11px}
.top .demo select{font-size:11px;padding:3px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;outline:none}
.top .demo select option{color:#1f2329}
.wrap{padding:12px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats .s{background:#fff;border-radius:10px;padding:12px 6px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.stats .s .n{font-size:20px;font-weight:700;color:#2563eb}
.stats .s .l{font-size:11px;color:#6b7280;margin-top:3px}
.stats .s.warn .n{color:#f59e0b}.stats .s.danger .n{color:#ef4444}.stats .s.ok .n{color:#10b981}
.task{border-left:4px solid #2563eb;padding:11px 12px;margin-bottom:9px;background:#fafbfd;border-radius:8px;cursor:pointer}
.task.overdue{border-left-color:#ef4444;background:#fef5f5}
.task.done{border-left-color:#10b981;background:#f4fdf9;opacity:.85}
.task.review{border-left-color:#f59e0b;background:#fffbeb}
.task.final{border-left-color:#a855f7;background:#faf5ff}
.task .t{font-weight:600;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.task .t .no{font-size:11px;color:#9ca3af;font-weight:400}
.task .m{font-size:11px;color:#6b7280;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:9px;background:#e5e7eb;color:#4b5563;white-space:nowrap}
.tag.blue{background:#dbeafe;color:#1e40af}.tag.red{background:#fee2e2;color:#991b1b}
.tag.green{background:#d1fae5;color:#065f46}.tag.orange{background:#ffedd5;color:#9a3412}
.tag.purple{background:#ede9fe;color:#5b21b6}.tag.gray{background:#f3f4f6;color:#6b7280}
.tag.pink{background:#fce7f3;color:#9d174d}
.pbar{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:3px}
.pbar.red i{background:linear-gradient(90deg,#ef4444,#f87171)}
.btn{display:inline-block;padding:8px 15px;border-radius:8px;border:none;font-size:13px;cursor:pointer;background:#2563eb;color:#fff;font-family:inherit}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.gray{background:#e5e7eb;color:#374151}.btn.red{background:#ef4444}
.btn.green{background:#10b981}.btn.orange{background:#f59e0b}.btn.purple{background:#a855f7}
.btn.full{width:100%;padding:11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.room{background:#f7f9fc;border-radius:10px;padding:10px;height:300px;overflow-y:auto;margin:10px 0;border:1px solid #eef1f6}
.msg{margin-bottom:12px}
.msg .h{font-size:11px;color:#6b7280;margin-bottom:3px;display:flex;gap:6px;flex-wrap:wrap}
.msg .h .who{color:#2563eb;font-weight:600}
.msg .c{font-size:13px;background:#fff;padding:8px 11px;border-radius:9px;display:inline-block;max-width:88%;word-break:break-word;line-height:1.5;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.sys .c{background:#fef3c7;color:#92400e;font-size:12px}
.msg.mine{text-align:right}.msg.mine .c{background:#dbeafe;color:#1e3a8a}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:13px;outline:none}
.input-row input:focus{border-color:#2563eb}
.tabs{display:flex;background:#fff;position:fixed;bottom:0;left:0;right:0;border-top:1px solid #e5e7eb;z-index:90;max-width:1000px;margin:0 auto}
.tabs div{flex:1;text-align:center;padding:8px 0 6px;font-size:11px;color:#6b7280;cursor:pointer;position:relative}
.tabs div.active{color:#2563eb;font-weight:600}
.tabs div .i{font-size:19px;display:block;line-height:1.3}
.tabs .dot{position:absolute;top:6px;right:22%;min-width:16px;height:16px;background:#ef4444;color:#fff;border-radius:8px;font-size:10px;line-height:16px;text-align:center;padding:0 3px}
.empty{text-align:center;padding:36px 16px;color:#9ca3af;font-size:13px}
.empty .e{font-size:36px;display:block;margin-bottom:8px;opacity:.5}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:16px}
.fi{margin-bottom:12px}
.fi label{display:block;font-size:12px;color:#374151;margin-bottom:5px;font-weight:500}
.fi label .req{color:#ef4444}
.fi input,.fi select,.fi textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:#fff}
.fi textarea{resize:vertical;min-height:56px}
.fi input:focus,.fi select:focus,.fi textarea:focus{border-color:#2563eb}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.sc .p{font-weight:600;color:#2563eb}.sc .p.minus{color:#ef4444}
.sc .d{font-size:11px;color:#9ca3af;margin-top:2px}
.hint{font-size:11px;color:#9ca3af;margin-top:5px;line-height:1.5}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 11px;border-radius:8px;font-size:12px;margin-bottom:10px}
.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.login-box{position:fixed;inset:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.login-card{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:19px;text-align:center;color:#1e3a8a;margin-bottom:6px}
.login-card .sub{font-size:12px;color:#6b7280;text-align:center;margin-bottom:22px}
.login-card .fi label{font-size:12px}
.login-card select{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;outline:none;margin-bottom:14px;background:#fff}
.login-card input{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:9px;font-size:14px;outline:none;margin-bottom:14px}
.login-card input:focus,.login-card select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.login-card button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:9px;font-size:15px;cursor:pointer;font-family:inherit}
.login-card .tip{font-size:11px;color:#9ca3af;text-align:center;margin-top:14px;line-height:1.6}
.demo-badge{display:inline-block;background:#fef3c7;color:#92400e;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}.top .demo{position:static;display:block;margin-top:6px}}
</style>
</head>
<body>

<!-- 登录页 -->
<div class="login-box" id="loginBox">
  <div class="login-card">
    <h1>永定绩效</h1>
    <div class="sub">打击办案积分管理系统 · 演示版</div>
    <label style="font-size:12px;color:#374151;display:block;margin-bottom:5px">选择账号</label>
    <select id="loginUser">
      <option value="">— 请选择演示账号 —</option>
      <option value="张所">张所（所领导）</option>
      <option value="刘队长">刘队长（打击队长）</option>
      <option value="陈副队">陈副队（副队长）</option>
      <option value="张警官">张警官（主办人·民警）</option>
      <option value="李警官">李警官（普通民警）</option>
      <option value="王辅警">王辅警（辅警）</option>
      <option value="赵辅警">赵辅警（辅警）</option>
      <option value="陈联络员">陈联络员（警务联络员）</option>
      <option value="孙保安">孙保安（保安员）</option>
      <option value="周法制">周法制（法制员）</option>
      <option value="吴内勤">吴内勤（内勤人员）</option>
      <option value="郑指挥">郑指挥（综合指挥室）</option>
      <option value="王社区">王社区（社区警务队）</option>
      <option value="审审计">审审计（审计员）</option>
      <option value="系统管理员">系统管理员</option>
    </select>
    <label style="font-size:12px;color:#374151;display:block;margin-bottom:5px">密码</label>
    <input id="loginPwd" type="password" value="123456" placeholder="演示密码：123456">
    <button onclick="doLogin()">登 录</button>
    <div class="tip">演示密码统一为 123456<br>登录后可点右上角"身份"随时切换</div>
  </div>
</div>

<div class="top">
  <h1>永定绩效 · 打击办案积分管理</h1>
  <div class="sub">任务协作 · 全程留痕 · 积分考核</div>
  <div class="who" id="who" onclick="logout()">未登录</div>
  <div class="demo" id="demoBox" style="display:none">
    <select id="demoSwitch" onchange="demoSwitchUser(this.value)">
      <option value="">演示切换…</option>
      <option value="张所">张所（所领导）</option>
      <option value="刘队长">刘队长（打击队长）</option>
      <option value="陈副队">陈副队（副队长）</option>
      <option value="张警官">张警官（主办人）</option>
      <option value="李警官">李警官（普通民警）</option>
      <option value="王辅警">王辅警（辅警）</option>
      <option value="赵辅警">赵辅警（辅警）</option>
      <option value="陈联络员">陈联络员（联络员）</option>
      <option value="孙保安">孙保安（保安员）</option>
      <option value="周法制">周法制（法制员）</option>
      <option value="吴内勤">吴内勤（内勤）</option>
      <option value="郑指挥">郑指挥（指挥室）</option>
      <option value="王社区">王社区（社区队）</option>
      <option value="审审计">审审计（审计员）</option>
    </select>
  </div>
</div>

<div class="wrap">
  <div id="p-home">
    <div class="notice" id="notice" style="display:none"></div>
    <div class="stats">
      <div class="s warn" onclick="filterTasks('run')"><div class="n" id="n-run">0</div><div class="l">进行中</div></div>
      <div class="s" onclick="filterTasks('review')"><div class="n" id="n-review">0</div><div class="l">待我审</div></div>
      <div class="s danger" onclick="filterTasks('overdue')"><div class="n" id="n-over">0</div><div class="l">超期</div></div>
      <div class="s ok" onclick="filterTasks('all')"><div class="n" id="n-score">0</div><div class="l">我的积分</div></div>
    </div>
    <div class="card">
      <h3><span>任务列表 <span class="demo-badge" id="scopeBadge"></span></span>
        <span>
          <button class="btn sm gray" onclick="filterTasks('all')">全部</button>
          <button class="btn sm" id="btnCreate" onclick="openCreate()" style="display:none">+ 新建</button>
          <button class="btn sm gray" onclick="loadTasks();loadScores();checkTodo()">刷新</button>
        </span>
      </h3>
      <div id="taskList"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <h3>积分明细 <span class="hint">攻坚+5 · 线索+3 · 整改+2 · 超期-0.5/天</span></h3>
      <div id="scoreList"></div>
    </div>
  </div>
  <div id="p-detail" style="display:none"></div>
  <div id="p-todo" style="display:none"></div>
  <div id="p-logs" style="display:none"></div>
</div>

<div class="tabs">
  <div class="active" data-tab="home" onclick="go('home')"><span class="i">📋</span>任务<span class="dot" id="dotHome" style="display:none"></span></div>
  <div data-tab="todo" onclick="go('todo')"><span class="i">✅</span>待办<span class="dot" id="dotTodo" style="display:none"></span></div>
  <div data-tab="logs" id="tabLogs" style="display:none" onclick="go('logs')"><span class="i">🔍</span>日志</div>
  <div data-tab="me" onclick="logout()"><span class="i">👤</span>身份</div>
</div>

<div class="modal-bg" id="createM">
  <div class="modal">
    <h3>新建任务</h3>
    <div class="fi"><label>任务标题 <span class="req">*</span></label><input id="f-title" placeholder="如：核查XX线索"></div>
    <div class="row2">
      <div class="fi"><label>类型</label>
        <select id="f-type">
          <option>专项攻坚</option><option>线索核查</option><option>案件协作</option>
          <option>执法整改</option><option>值班督办</option><option>培训学习</option><option>临时任务</option>
        </select>
      </div>
      <div class="fi"><label>优先级</label>
        <select id="f-pri"><option value="1">高</option><option value="2" selected>中</option><option value="3">低</option></select>
      </div>
    </div>
    <div class="row2">
      <div class="fi"><label>截止时间 <span class="req">*</span></label><input id="f-end" type="datetime-local"></div>
      <div class="fi"><label>主办人</label><input id="f-host" placeholder="默认本人"></div>
    </div>
    <div class="fi"><label>协办人（逗号分隔）</label><input id="f-assist" placeholder="如：李警官,王辅警"></div>
    <div class="fi"><label>关联案号/线索号</label><input id="f-case"></div>
    <div class="fi"><label>成果要求</label><textarea id="f-req"></textarea></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn gray full" onclick="closeM('createM')">取消</button>
      <button class="btn full" onclick="createTask()">创建任务</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="todoM">
  <div class="modal">
    <h3>待办提醒</h3>
    <div id="todoContent"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn full" onclick="closeM('todoM')">知道了</button>
    </div>
  </div>
</div>

<script>
const API = location.origin + '/api';
let me = JSON.parse(localStorage.getItem('yd_me') || 'null');
let currentTaskId = null;
let taskFilter = 'all';

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { if(!s) return '未设置'; const d = new Date(s.replace(' ','T')); return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const fmtT = s => { const d = new Date(s.replace(' ','T')); return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

function doLogin() {
  const name = $('loginUser').value;
  const pwd = $('loginPwd').value;
  if (!name) return alert('请选择账号');
  fetch(API+'/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, password: pwd })
  }).then(r=>r.json()).then(u => {
    if (u.error) return alert(u.error);
    me = u;
    localStorage.setItem('yd_me', JSON.stringify(me));
    $('loginBox').style.display = 'none';
    initUI();
  });
}

function demoSwitchUser(name) {
  if (!name) return;
  fetch(API+'/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, password: '123456' })
  }).then(r=>r.json()).then(u => {
    me = u;
    localStorage.setItem('yd_me', JSON.stringify(me));
    $('demoSwitch').value = '';
    initUI();
    go('home');
  });
}

function logout() {
  if (!confirm('确认退出登录？')) return;
  localStorage.removeItem('yd_me');
  me = null;
  location.reload();
}

function initUI() {
  $('who').textContent = '👤 '+me.name+' · '+me.role;
  $('demoBox').style.display = 'block';
  $('btnCreate').style.display = me.perm.create ? 'inline-block' : 'none';
  $('tabLogs').style.display = ['审计员','系统管理员'].includes(me.role) ? 'block' : 'none';
  const scopeText = { all:'全所可见', team:'本组可见', self:'仅本人可见' }[me.perm.scope] || '';
  $('scopeBadge').textContent = scopeText;
  loadTasks(); loadScores(); checkTodo(true);
}

function go(p) {
  ['home','detail','todo','logs'].forEach(x => $('p-'+x).style.display = x===p?'block':'none');
  document.querySelectorAll('.tabs div').forEach(e => e.classList.toggle('active', e.dataset.tab===p));
  if (p==='home') { loadTasks(); loadScores(); }
  if (p==='todo') renderTodo();
  if (p==='logs') loadLogs();
  window.scrollTo(0,0);
}

function checkTodo(firstTime) {
  if (!me) return;
  fetch(API+'/todo?name='+encodeURIComponent(me.name))
    .then(r=>r.json()).then(t => {
      const total = t.total;
      $('dotHome').style.display = total>0 ? 'block' : 'none';
      $('dotHome').textContent = total>0 ? total : '';
      $('dotTodo').style.display = total>0 ? 'block' : 'none';
      $('dotTodo').textContent = total>0 ? total : '';
      $('n-review').textContent = t.review + t.final;
      if (firstTime && total>0) {
        $('todoContent').innerHTML = `
          <div class="sc"><div>新任务待接收</div><div class="p">${t.pending}</div></div>
          <div class="sc"><div>待我审核</div><div class="p">${t.review}</div></div>
          <div class="sc"><div>待我终审</div><div class="p">${t.final}</div></div>
          <div class="sc"><div>已超期</div><div class="p minus">${t.overdue}</div></div>
          <div class="hint">共 ${total} 项待办，可到「待办」页查看详情</div>
        `;
        $('todoM').classList.add('show');
      }
    });
}

function loadTasks() {
  if (!me) return;
  fetch(API+'/tasks?name='+encodeURIComponent(me.name))
    .then(r=>r.json()).then(list => {
      const now = new Date();
      const my = list;
      $('n-run').textContent = my.filter(t=>t.status==='RUNNING'||t.status==='PENDING'||t.status==='REVIEW'||t.status==='FIRST_REVIEW').length;
      const over = my.filter(t => (t.status==='RUNNING'||t.status==='PENDING') && t.end_time && new Date(t.end_time.replace(' ','T')) < now);
      $('n-over').textContent = over.length;
      if (over.length) {
        $('notice').style.display='block';
        $('notice').innerHTML = '⚠️ 有 <b>'+over.length+'</b> 个超期任务，请尽快处理。超期每日扣0.5分。';
      } else { $('notice').style.display='none'; }

      let display = my;
      if (taskFilter==='run') display = my.filter(t=>['RUNNING','PENDING','REVIEW','FIRST_REVIEW'].includes(t.status));
      if (taskFilter==='overdue') display = over;
      if (taskFilter==='review') display = my.filter(t=>t.canFirst||t.canFinal);

      const box = $('taskList');
      if (!display.length) { box.innerHTML = '<div class="empty"><span class="e">📭</span>暂无任务</div>'; return; }
      const map = { PENDING:'待接收', RUNNING:'进行中', REVIEW:'待审核', FIRST_REVIEW:'待终审', DONE:'已完成', OVERDUE:'已超期', ARCHIVED:'已归档', CANCELED:'已取消' };
      box.innerHTML = display.map(t => {
        const ov = (t.status==='RUNNING'||t.status==='PENDING') && t.end_time && new Date(t.end_time.replace(' ','T')) < now;
        const cls = ov?'overdue':(t.status==='DONE'||t.status==='ARCHIVED'?'done':(t.status==='FIRST_REVIEW'?'final':(t.status==='REVIEW'?'review':'')));
        return `<div class="task ${cls}" onclick="openTask(${t.id})">
          <div class="t"><span>${esc(t.title)}</span><span class="no">${esc(t.task_no)}</span></div>
          <div class="m">
            <span class="tag blue">${esc(t.task_type)}</span>
            <span class="tag ${ov?'red':(t.status==='DONE'?'green':(t.status==='FIRST_REVIEW'?'pink':(t.status==='REVIEW'?'orange':'purple')))}">${ov?'已超期':esc(map[t.status]||t.status)}</span>
            ${t.priority==1?'<span class="tag red">高优先级</span>':''}
            <span>截止 ${fmt(t.end_time)}</span>
            ${t.canFirst?'<span class="tag orange">待我审</span>':''}
            ${t.canFinal?'<span class="tag pink">待我终审</span>':''}
          </div>
          <div class="pbar ${ov?'red':''}"><i style="width:${t.progress||0}%"></i></div>
        </div>`;
      }).join('');
    });
}

function filterTasks(f) { taskFilter=f; loadTasks(); }

function loadScores() {
  if (!me) return;
  fetch(API+'/scores?user='+encodeURIComponent(me.name))
    .then(r=>r.json()).then(list => {
      const total = list.reduce((a,b)=>a+b.score,0);
      $('n-score').textContent = total.toFixed(1);
      $('scoreList').innerHTML = list.length ?
        list.map(s=>`<div class="sc"><div><div>${esc(s.reason)}</div><div class="d">${esc(s.create_time)}</div></div><div class="p ${s.score<0?'minus':''}">${s.score>0?'+':''}${s.score}</div></div>`).join('')
        : '<div class="empty" style="padding:18px"><span class="e">🏆</span>暂无积分记录</div>';
    });
}
